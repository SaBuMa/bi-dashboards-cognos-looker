name: Validate dashboard KPIs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Recompute KPIs and compare with dashboards
        run: python analysis/validate_kpis.py

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kpi-validation-report
          path: reports/kpi_validation_report.md
